<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Healthcare Record System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
}

.card {
    width: 400px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(15px);
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    text-align: center;
    color: white;
}

h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: white;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.04);
    background: #eaeaea;
}

#appBox {
    display: none;
}

.output {
    margin-top: 15px;
    max-height: 250px;
    overflow-y: auto;
    text-align: left;
}

.record {
    background: rgba(255,255,255,0.2);
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="card" id="loginBox">
    <h2>🔐 Secure Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div class="card" id="appBox">
    <h2>🏥 Healthcare Record Protection</h2>

    <input type="text" id="name" placeholder="Patient Name">
    <input type="number" id="age" placeholder="Age">
    <input type="text" id="diagnosis" placeholder="Diagnosis">

    <button onclick="addRecord()">Add Record</button>
    <button onclick="viewRecords()">View Records</button>

    <div class="output" id="output"></div>
</div>

<script>
let key;

// Persistent key generation
async function generateKey() {
    let savedKey = localStorage.getItem("secretKey");

    if (savedKey) {
        let raw = Uint8Array.from(atob(savedKey), c => c.charCodeAt(0));

        key = await crypto.subtle.importKey(
            "raw",
            raw,
            { name: "AES-GCM" },
            true,
            ["encrypt", "decrypt"]
        );
    } else {
        key = await crypto.subtle.generateKey(
            { name: "AES-GCM", length: 256 },
            true,
            ["encrypt", "decrypt"]
        );

        let exported = await crypto.subtle.exportKey("raw", key);
        let base64 = btoa(String.fromCharCode(...new Uint8Array(exported)));

        localStorage.setItem("secretKey", base64);
    }
}

// Encrypt
async function encrypt(text) {
    let iv = crypto.getRandomValues(new Uint8Array(12));

    let encoded = new TextEncoder().encode(text);

    let encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        encoded
    );

    return {
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(encrypted))
    };
}

// Decrypt
async function decrypt(obj) {
    let iv = new Uint8Array(obj.iv);
    let data = new Uint8Array(obj.data);

    let decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        data
    );

    return new TextDecoder().decode(decrypted);
}

// LOGIN
async function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if (user === "Atharv" && pass === "654321") {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("appBox").style.display = "block";
        await generateKey();
        alert("Login Successful!");
    } else {
        alert("Invalid credentials!");
    }
}

// ADD RECORD
async function addRecord() {
    let name = document.getElementById("name").value;
    let age = document.getElementById("age").value;
    let diagnosis = document.getElementById("diagnosis").value;

    if (!name || !age || !diagnosis) {
        alert("Please fill all fields");
        return;
    }

    let encrypted = await encrypt(diagnosis);

    let record = {
        name,
        age,
        diagnosis: encrypted
    };

    let records = JSON.parse(localStorage.getItem("records") || "[]");
    records.push(record);

    localStorage.setItem("records", JSON.stringify(records));

    alert("Record added securely!");

    document.getElementById("name").value = "";
    document.getElementById("age").value = "";
    document.getElementById("diagnosis").value = "";
}

// VIEW RECORDS
async function viewRecords() {
    let records = JSON.parse(localStorage.getItem("records") || "[]");

    let output = "";

    if(records.length === 0){
        output = "<div class='record'>No records found</div>";
    }

    for (let r of records) {
        try {
            let decrypted = await decrypt(r.diagnosis);

            output += `
            <div class="record">
                <b>Name:</b> ${r.name}<br>
                <b>Age:</b> ${r.age}<br>
                <b>Diagnosis:</b> ${decrypted}
            </div>
            `;
        } catch {
            output += `<div class="record">⚠️ Cannot decrypt record</div>`;
        }
    }

    document.getElementById("output").innerHTML = output;
}
</script>

</body>
</html>
